<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai_01</title>
    <style>
        body{
            /* Căn giữa bằng flexbox*/
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .khung-tho{
            /* rộng: 640px */
            width: 640px;
            text-align: center;
            background-color: #FFFDE7;
            border: 1px solid #9E9E9E;
            padding: 24px;
        }

        h1{
            color: #D40000;
            background-color: #ffd9e6;
            font-size: 26px;
            padding: 6px 0;
            margin: 0 0 20px;
            text-align: center;
        }

        p{
            line-height: 1.7;
            font-style: italic;
            margin-bottom: 20px;
            text-align: center;
        }

        .kho-xanh{
            color: #0033CC;

        }

        .kho-do{
            color: #D40000;
        }

        hr{
            width: 55%;
            border-top: 1px solid #0033CC;
        }
    </style>
</head>
<body>
    
    <article class="khung-tho">
        
        <h1>BỐN MÙA</h1>
        <p class="kho-xanh">
             Xuân về hoa nở khắp nơi
            <br> Hạ sang nắng cháy rạng ngời phố quen
            <br> Thu về lá rụng bên thềm
        </p>
        <hr>
        <p class="kho-do">
            Đông sang gió lạnh bên em đợi chờ
            <br>Bốn mùa là bốn giấc mơ
            <br>Thời gian đi mãi ta chờ đợi ai
        </p>

        <hr>
        <p class="kho-xanh">
             Một năm rồi lại một năm
            <br> Vẫn còn câu hát thì thầm quê hương
            <br> Chờ xuân nắng mới soi đường
        </p>
    </article>
    
</body>
</html>
